<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNMI Data</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <svg class="logo" xmlns="http://www.w3.org/2000/svg" width="43" height="40" viewBox="0 0 43 40" fill="none">
                <path d="M12.1074 5.50748C15.8 -1.83583 26.283 -1.83583 29.9756 5.50748L34.6758 14.8542L40.4209 23.5993C44.9338 30.4687 39.6929 39.5464 31.4873 39.0729L21.042 38.4704L10.5967 39.0729C2.39103 39.5467 -2.85066 30.4688 1.66211 23.5993L7.40723 14.8542L12.1074 5.50748ZM21.3916 12.2311C15.7882 12.2311 11.2461 16.7732 11.2461 22.3766C11.2461 27.9801 15.7882 32.5221 21.3916 32.5221C26.995 32.5221 31.5371 27.9801 31.5371 22.3766C31.5371 16.7732 26.995 12.2311 21.3916 12.2311Z" fill="#197C7B"/>
              </svg>
            <div class="logo-text">AfricAir Lab</div>
        </div>
        <div class="header-right">
            <button class="hamburger-menu" id="hamburgerMenu" aria-label="Toggle menu">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
        </div>
    </header>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="dropdown-menu" id="dropdownMenu">
        <div class="search-container">
            <img src="https://www.figma.com/api/mcp/asset/8ae6659d-1571-4967-8d51-cc0a1a7d0213" alt="Search" class="search-icon">
            <select class="city-dropdown" id="cityDropdown">
            </select>
        </div>
        <div class="locations-list" id="locationsList">
            <!-- Location items will be populated here -->
        </div>
        <div class="sidebar-buttons">
            <a href="https://knmi.waijenbergmedia.nl/admin" target="_blank" class="sidebar-button button-login">Log in</a>
            <a class="sidebar-button button-export">Export Data</a>
        </div>
    </div>
    <div class="location-details-panel" id="locationDetailsPanel">
        <div class="location-panel-overlay" id="locationPanelOverlay"></div>
        <div class="location-panel-content">
            <div class="location-header">
                <div class="location-date" id="locationDate">November 2025</div>
                <div class="location-name-header" id="locationNameHeader">Adum</div>
                <div class="location-value" id="locationValue">5 µg/m³</div>
            </div>
            <div class="location-chart-section">
                <div class="chart-title">Nitrogen levels in µg/m³ 2025</div>
                <div class="chart-container">
                    <div class="chart-y-axis">
                        <div class="y-axis-label">Nitrogen lvl in µg/m³</div>
                        <div class="y-axis-arrow">↑</div>
                    </div>
                    <div class="chart-area">
                        <div class="chart-bars" id="chartBars"></div>
                        <div class="chart-x-axis">
                            <div class="x-axis-label">Date in Month</div>
                            <div class="x-axis-arrow">→</div>
                        </div>
                    </div>
                    <div class="chart-info-icon">
                        i
                        <div class="chart-info-tooltip">This threshold line represents the EU international limit values. The limit value is 60 µg/m³.</div>
                    </div>
                </div>
            </div>
            <div class="location-navigation">
                <button class="nav-arrow nav-arrow-left" id="prevYear">←</button>
                <div class="location-year" id="locationYear">2026</div>
                <button class="nav-arrow nav-arrow-right" id="nextYear">→</button>
            </div>
            <div class="location-month-selector" id="locationMonthSelector">
                <div class="month-item">
                    <div class="month-name">Oktober</div>
                    <div class="month-value">48 µg/m³</div>
                </div>
            </div>
            <button class="close-location-panel" id="closeLocationPanel">×</button>
        </div>
    </div>
    <div class="color-legend">
        <div class="legend-bars">
            <div class="legend-bar" style="background-color: #7ed8ca;">
                <span class="legend-label">0-10</span>
            </div>
            <div class="legend-bar" style="background-color: #5eb5a7;">
                <span class="legend-label">10-20</span>
            </div>
            <div class="legend-bar" style="background-color: #3d9f90;">
                <span class="legend-label">20-30</span>
            </div>
            <div class="legend-bar" style="background-color: #267165;">
                <span class="legend-label">30-40</span>
            </div>
            <div class="legend-bar" style="background-color: #0c5554;">
                <span class="legend-label">50-60</span>
            </div>
            <div class="legend-bar" style="background-color: #043931;">
                <span class="legend-label">60-70</span>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="map-container" id="mapContainer">
            <div id="map"></div>
        </div>
        <div id="data">
            <div class="loading">Loading data...</div>
        </div>
    </div> 

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="script.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
</body>
</html>
