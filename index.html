<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNMI Data</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <img src="https://www.figma.com/api/mcp/asset/a7898d8e-32c6-464e-b0d9-70bc0cacf852" alt="AfricAir Lab Logo">
            </div>
            <div class="logo-text">AfricAir Lab</div>
        </div>
        <div class="header-right">
            <button class="hamburger-menu" id="hamburgerMenu" aria-label="Toggle menu">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
        </div>
    </header>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="dropdown-menu" id="dropdownMenu">
        <div class="search-container">
            <img src="https://www.figma.com/api/mcp/asset/8ae6659d-1571-4967-8d51-cc0a1a7d0213" alt="Search" class="search-icon">
            <select class="city-dropdown" id="cityDropdown">
            </select>
        </div>
        <div class="sidebar-buttons">
            <a href="https://knmi.waijenbergmedia.nl/admin" target="_blank" class="sidebar-button button-login">Log in</a>
            <a class="sidebar-button button-export">Export Data</a>
        </div>
    </div>
    <div class="location-details-panel" id="locationDetailsPanel">
        <div class="location-panel-overlay" id="locationPanelOverlay"></div>
        <div class="location-panel-content">
            <div class="location-header">
                <div class="location-date" id="locationDate">November 2025</div>
                <div class="location-name-header" id="locationNameHeader">Adum</div>
                <div class="location-value" id="locationValue">5 µg/m³</div>
            </div>
            <div class="location-chart-section">
                <div class="chart-title">Nitrogen levels in µg/m³ 2025</div>
                <div class="chart-container">
                    <div class="chart-y-axis">
                        <div class="y-axis-label">Nitrogen lvl in µg/m³</div>
                        <div class="y-axis-arrow">↑</div>
                    </div>
                    <div class="chart-area">
                        <div class="chart-bars" id="chartBars"></div>
                        <div class="chart-x-axis">
                            <div class="x-axis-label">Date in Month</div>
                            <div class="x-axis-arrow">→</div>
                        </div>
                    </div>
                    <div class="chart-info-icon">i</div>
                </div>
            </div>
            <div class="location-navigation">
                <button class="nav-arrow nav-arrow-left" id="prevYear">←</button>
                <div class="location-year" id="locationYear">2026</div>
                <button class="nav-arrow nav-arrow-right" id="nextYear">→</button>
            </div>
            <div class="location-month-selector" id="locationMonthSelector">
                <div class="month-item">
                    <div class="month-name">Oktober</div>
                    <div class="month-value">48 µg/m³</div>
                </div>
            </div>
            <button class="close-location-panel" id="closeLocationPanel">×</button>
        </div>
    </div>
    <div class="container">
        <div class="map-container" id="mapContainer">
            <div id="map"></div>
        </div>
        <div id="data">
            <div class="loading">Loading data...</div>
        </div>
    </div> 

<script src="script.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
</body>
</html>
